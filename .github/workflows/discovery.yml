name: Pa'l Jangueo - Event Discovery

on:
  workflow_dispatch:
    inputs:
      stage_candidates:
        description: 'Save candidates for review without publishing'
        required: false
        type: boolean
        default: false
      publish_boletera:
        description: 'Publish verified Boletera events in this manual run'
        required: false
        type: boolean
        default: false

  schedule:
    - cron: '17 */6 * * *'
      timezone: 'America/Puerto_Rico'

permissions:
  contents: read

concurrency:
  group: pal-jangueo-discovery
  cancel-in-progress: false

jobs:
  discover:
    name: Discover music events
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: server

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Validate discovery and publication code
        run: |
          npm test
          node --check scripts/run-discovery.js
          node --check scripts/stage-boletera-event.js
          node --check scripts/auto-publish-boletera.js
          node --check scripts/auto-publish-prticket.js
          node --check scripts/discover-prticket.js
          node --check scripts/stage-prticket-candidates.js
          node --check utils/assessMusicEvidence.js
          node --check utils/extractBoleteraFlyer.js

      - name: Prepare Supabase certificate
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.stage_candidates == true) }}
        env:
          SUPABASE_CA_CERT: ${{ secrets.SUPABASE_CA_CERT }}
        run: |
          test -n "$SUPABASE_CA_CERT"
          umask 077
          printf '%s\n' "$SUPABASE_CA_CERT" > "$RUNNER_TEMP/supabase-ca.crt"

      - name: Test Supabase connection
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.stage_candidates == true) }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_CA_PATH: ${{ runner.temp }}/supabase-ca.crt
        run: |
          test -n "$DATABASE_URL"
          node -e '
            const pool = require("./db");

            pool.query("SELECT 1 AS ok")
              .then(result => {
                if (result.rows[0]?.ok !== 1) {
                  throw new Error("Respuesta inesperada");
                }
                console.log("Supabase: conexión OK");
              })
              .catch(error => {
                console.error(
                  "Error de conexión:",
                  error.code || error.message
                );
                process.exitCode = 1;
              })
              .finally(() => pool.end());
          '

      - name: Stage PRticket candidates
        id: prticket_stage
        continue-on-error: true
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.stage_candidates == true) }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_CA_PATH: ${{ runner.temp }}/supabase-ca.crt
        run: node scripts/stage-prticket-candidates.js --stage --all

      - name: Verify trusted PRticket venues
        id: prticket_venues
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.stage_candidates == true) }}
        continue-on-error: true
        working-directory: server
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_CA_PATH: ${{ runner.temp }}/supabase-ca.crt
        run: node scripts/auto-verify-prticket-venues.js --apply

      - name: Publish verified PRticket events
        id: prticket_publication
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.stage_candidates == true) }}
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_CA_PATH: ${{ runner.temp }}/supabase-ca.crt
        working-directory: server
        run: node scripts/auto-publish-prticket.js --publish --all

      - name: Discover events from all sources
        id: multisource_discovery
        continue-on-error: true
        run: node scripts/discover-all.js

      - name: Stage candidates for manual review
        id: boletera_stage
        continue-on-error: true
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.stage_candidates == true) }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_CA_PATH: ${{ runner.temp }}/supabase-ca.crt
        run: node scripts/run-discovery.js --all --stage --bulk-stage

      - name: Enrich pending artists with Gemini
        id: artist_enrichment
        continue-on-error: true
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.stage_candidates == true) }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_CA_PATH: ${{ runner.temp }}/supabase-ca.crt
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          test -n "$GEMINI_API_KEY"
          node scripts/enrich-pending-artists.js --save

      - name: Evaluate independent scene relevance
        id: scene_evaluation
        continue-on-error: true
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.stage_candidates == true) }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_CA_PATH: ${{ runner.temp }}/supabase-ca.crt
        run: node scripts/evaluate-pending-scene.js --save

      - name: Publish verified Boletera events
        id: boletera_publication
        continue-on-error: true
        if: ${{ (github.event_name == 'schedule' && vars.BOLETERA_AUTO_PUBLISH == 'true') || (github.event_name == 'workflow_dispatch' && inputs.stage_candidates == true && inputs.publish_boletera == true) }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_CA_PATH: ${{ runner.temp }}/supabase-ca.crt
        run: node scripts/auto-publish-boletera.js --all --publish

      - name: Remove temporary certificate
        if: ${{ always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.stage_candidates == true)) }}
        run: rm -f "$RUNNER_TEMP/supabase-ca.crt"

      - name: Report discovery stage failures
        if: ${{ always() }}
        env:
          PRTICKET: ${{ steps.prticket_stage.outcome }}
          PRTICKET_VENUES: ${{ steps.prticket_venues.outcome }}
          PRTICKET_PUBLISH: ${{ steps.prticket_publication.outcome }}
          DISCOVERY: ${{ steps.multisource_discovery.outcome }}
          BOLETERA: ${{ steps.boletera_stage.outcome }}
          BOLETERA_PUBLISH: ${{ steps.boletera_publication.outcome }}
          ARTISTS: ${{ steps.artist_enrichment.outcome }}
          SCENE: ${{ steps.scene_evaluation.outcome }}
        run: |
          echo "PRticket: $PRTICKET"
          echo "PRticket venues: $PRTICKET_VENUES"
          echo "PRticket publication: $PRTICKET_PUBLISH"
          echo "Multi-source discovery: $DISCOVERY"
          echo "Boletera staging: $BOLETERA"
          echo "Boletera publication: $BOLETERA_PUBLISH"
          echo "Artist enrichment: $ARTISTS"
          echo "Scene evaluation: $SCENE"

          for result in "$PRTICKET" "$PRTICKET_VENUES" "$PRTICKET_PUBLISH" "$DISCOVERY" "$BOLETERA" "$BOLETERA_PUBLISH" "$ARTISTS" "$SCENE"; do
            if [ "$result" = "failure" ]; then
              echo "::error::One or more discovery stages failed."
              exit 1
            fi
          done

          echo "No discovery stage failures."
