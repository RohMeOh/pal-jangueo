name: Pa'l Jangueo - Event Discovery

on:
  workflow_dispatch:
    inputs:
      stage_candidates:
        description: 'Save candidates for review without publishing'
        required: false
        type: boolean
        default: false

  schedule:
    - cron: '17 */6 * * *'
      timezone: 'America/Puerto_Rico'

permissions:
  contents: read

concurrency:
  group: pal-jangueo-discovery
  cancel-in-progress: false

jobs:
  discover:
    name: Discover music events
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: server

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Prepare Supabase certificate
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.stage_candidates == true) }}
        env:
          SUPABASE_CA_CERT: ${{ secrets.SUPABASE_CA_CERT }}
        run: |
          test -n "$SUPABASE_CA_CERT"
          umask 077
          printf '%s\n' "$SUPABASE_CA_CERT" > "$RUNNER_TEMP/supabase-ca.crt"

      - name: Test Supabase connection
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.stage_candidates == true) }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_CA_PATH: ${{ runner.temp }}/supabase-ca.crt
        run: |
          test -n "$DATABASE_URL"
          node -e '
            const pool = require("./db");

            pool.query("SELECT 1 AS ok")
              .then(result => {
                if (result.rows[0]?.ok !== 1) {
                  throw new Error("Respuesta inesperada");
                }
                console.log("Supabase: conexión OK");
              })
              .catch(error => {
                console.error(
                  "Error de conexión:",
                  error.code || error.message
                );
                process.exitCode = 1;
              })
              .finally(() => pool.end());
          '

      - name: Discover events from all sources
        run: node scripts/discover-all.js

      - name: Stage candidates for manual review
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.stage_candidates == true) }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_CA_PATH: ${{ runner.temp }}/supabase-ca.crt
        run: node scripts/run-discovery.js --stage

      - name: Enrich pending artists with Gemini
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.stage_candidates == true) }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_CA_PATH: ${{ runner.temp }}/supabase-ca.crt
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          test -n "$GEMINI_API_KEY"
          node scripts/enrich-pending-artists.js --save

      - name: Remove temporary certificate
        if: ${{ always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.stage_candidates == true)) }}
        run: rm -f "$RUNNER_TEMP/supabase-ca.crt"
